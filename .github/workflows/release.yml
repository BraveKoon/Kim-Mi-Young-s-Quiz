name: Release

# 수동 실행 전용: CHANGELOG.md 의 해당 버전 섹션을 릴리즈 노트로 사용해 태그와 GitHub Release 를 만든다.
# 사용: Actions → Release → Run workflow → tag 에 `v1.5.1` 입력 (target 은 기본값 그대로)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리즈 태그 (예: v1.5.1) — CHANGELOG.md 에 "## [v1.5.1]" 섹션이 있어야 함'
        required: true
        type: string
      target:
        description: '릴리즈 대상 브랜치'
        required: false
        default: 'arena/c5bccda0-kim-mi-young-s-quiz'
        type: string

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}

      - name: 릴리즈 노트 추출
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::태그 형식은 vMAJOR.MINOR.PATCH 이어야 합니다 (입력: $TAG)"; exit 1
          fi
          awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1 { found = 1; print; next }
            found && /^## \[/ { exit }
            found && /^---$/ { next }
            found { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::error::CHANGELOG.md 에서 '## [$TAG]' 섹션을 찾지 못했습니다"; exit 1
          fi
          head -1 release-body.md | sed -E 's/^## \[[^]]+\] - [0-9-]+ — //' > release-title.txt
          sed -i 1d release-body.md
          cat release-body.md

      - name: Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::이미 $TAG 릴리즈가 있습니다"; exit 1
          fi
          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG — $(cat release-title.txt)" \
            --notes-file release-body.md
